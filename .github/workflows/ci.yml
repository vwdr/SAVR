name: bootstrap-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project test dependencies
        run: python3 -m pip install --disable-pip-version-check -e ".[test]"
      - name: Validate bootstrap files
        run: python3 scripts/validate_bootstrap.py
      - name: Run unit tests
        run: python3 -m pytest -q
